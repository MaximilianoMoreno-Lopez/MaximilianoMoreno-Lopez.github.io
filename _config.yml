locale                   : "en-US"
title                    : "Maximiliano Moreno-López"
title_separator          : "-"
name                     : "Maximiliano Moreno-López"
description              : "PhD candidate at Paris School of Economics. Research on climate policy, inequality, and equitable energy transitions."
url                      : "https://maximilianomoreno-lopez.github.io"
baseurl                  : ""
repository               : "MaximilianoMoreno-Lopez/MaximilianoMoreno-Lopez.github.io"

author:
  name             : "Maximiliano Moreno-López"
  avatar           : "foto maxi.png"
  bio              : "PhD candidate · Paris School of Economics"
  location         : "Paris, France"
  employer         : "Paris School of Economics"
  employer_url     : "https://www.parisschoolofeconomics.eu/en/"
  email            : "maximiliano.moreno-lopez@psemail.eu"
  googlescholar    : "https://scholar.google.com/citations?user=1bhaQUYAAAAJ&hl=en"
  github           : "maximilianomoreno-lopez"
  linkedin         : "maximiliano-moreno-l%C3%B3pez-854101175/"

publication_category:
  manuscripts:
    title: 'Journal Articles'
  working_papers:
    title: 'Working Papers & Work in Progress'
  conferences:
    title: 'Policy Reports & Conference Papers'

teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : false
read_more                : "disabled"
talkmap_link             : false

comments:
  provider               :

atom_feed:
  hide                   : false

analytics:
  provider               : "false"

include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Etc/UTC

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
