# Teaching resources listed on /resources/ (grouped by course, in the order of
# course_order in _pages/resources.html). A resource with `parent: <id>` is
# listed nested under the resource that carries that `id`.
# url: internal permalink (e.g. /resources/derivatives/) or an external link / PDF in /files/
- id: derivatives
  title: "Derivatives: A Refresher"
  course: "Mathematics"
  description: "What a derivative measures, the rules you need, and how economists use them: marginal cost, elasticity, optimisation."
  url: /resources/derivatives/
- title: "Derivatives Practice: Starter"
  parent: derivatives
  course: "Mathematics"
  description: "24 exercises on the definition and the basic rules."
  url: /resources/derivatives-warmup/
- title: "Derivatives Practice: Intermediate"
  parent: derivatives
  course: "Mathematics"
  description: "100 exercises on the product and quotient rules, almost no chain rule."
  url: /resources/derivatives-100/
- title: "Derivatives Practice: Upper Intermediate"
  parent: derivatives
  course: "Mathematics"
  description: "20 exercises with the chain rule and second derivatives."
  url: /resources/derivatives-second/
- id: partials
  title: "Partial Derivatives and Optimisation in Two Variables"
  course: "Mathematics"
  description: "Treat the other variables as constants: marginal utility, MRS, second-order partials, the D test for maxima and minima, and the Problem Set 1 model as a derivative exercise."
  url: /resources/partial-derivatives/
- title: "Partial Derivatives Practice"
  parent: partials
  course: "Mathematics"
  description: "22 exercises in three levels, from first partials to classifying critical points and the redistribution model."
  url: /resources/partial-derivatives-practice/
- id: lagrange
  title: "Lagrange Multipliers: Optimisation with Constraints"
  course: "Mathematics"
  description: "Tangency, the recipe, and what the multiplier really means: shadow prices, the envelope theorem and complementary slackness."
  url: /resources/lagrange-multipliers/
- title: "Lagrange Multipliers: Practice"
  parent: lagrange
  course: "Mathematics"
  description: "20 problems in three levels: numbers only, the standard economic problems, then two constraints, Kuhn-Tucker and the traps."
  url: /resources/lagrange-practice/
- title: "Maths for Intermediate Microeconomics"
  course: "Microeconomics"
  description: "Tutorial 1 companion: derivatives, logs, partials, optimisation, Lagrange, expectation and integrals, each with the essentials, a note and exercises, plus a study plan for the midterm."
  url: /resources/micro-maths/
